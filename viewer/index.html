<!doctype html>
<html lang="en-GB">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'self'; style-src 'self' 'unsafe-inline'; font-src 'self'; img-src 'self' data: blob:; connect-src 'self'; frame-src 'none'; worker-src 'self' blob:; object-src 'none'; base-uri 'none'; form-action 'none'">
<title>Excalidraw local viewer</title>
<link rel="stylesheet" href="style.css">
<script src="config.js"></script>
<script src="pane-fix.js"></script>
<script src="vendor/react.production.min.js"></script>
<script src="vendor/react-dom.production.min.js"></script>
<script src="vendor/dist/excalidraw.production.min.js"></script>
</head>
<body>
<div id="app"></div>
<div id="stickies" class="stickies" role="toolbar" aria-label="Sticky notes" data-sticky="none">
  <span class="stickies-label">Sticky</span>
  <span id="sticky-colours" class="sticky-colours"></span>
  <label class="stickies-label" for="sticky-tag">Tag</label>
  <input id="sticky-tag" class="sticky-tag" type="text" autocomplete="off" disabled placeholder="Select a sticky to tag it">
  <button id="sticky-tag-clear" class="sticky-clear" type="button" disabled>Clear</button>
  <button id="sticky-edit" class="sticky-clear" type="button" disabled title="Edit the text of the selected sticky">Edit text</button>
</div>
<script src="stickies.js"></script>
<script src="stickies-ui.js"></script>
<script src="app.js"></script>
</body>
</html>
